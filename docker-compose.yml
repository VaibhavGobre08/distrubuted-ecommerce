services:

  # ==========================================
  # POSTGRESQL
  # ==========================================

  postgres:
    image: postgres:17
    container_name: ecommerce-postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10


  # ==========================================
  # KAFKA
  # ==========================================

  kafka:
    image: apache/kafka:4.0.0
    container_name: ecommerce-kafka

    ports:
      - "9092:9092"

    environment:

      KAFKA_NODE_ID: 1

      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093

      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"
        ]
      interval: 10s
      timeout: 10s
      retries: 10


  # ==========================================
  # ORDER SERVICE
  # ==========================================

  order-service:
    build:
      context: ./order-service

    container_name: ecommerce-order-service

    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

    environment:

      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/order_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres

      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092

    ports:
      - "8081:8081"


  # ==========================================
  # INVENTORY SERVICE
  # ==========================================

  inventory-service:
    build:
      context: ./inventory-service

    container_name: ecommerce-inventory-service

    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

    environment:

      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/inventory_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres

      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092

    ports:
      - "8082:8082"


  # ==========================================
  # PAYMENT SERVICE
  # ==========================================

  payment-service:
    build:
      context: ./payment-service

    container_name: ecommerce-payment-service

    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

    environment:

      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/payment_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres

      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092

    ports:
      - "8083:8083"


  # ==========================================
  # SHIPPING SERVICE
  # ==========================================

  shipping-service:
    build:
      context: ./shipping-service

    container_name: ecommerce-shipping-service

    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

    environment:

      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/shipping_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres

      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092

    ports:
      - "8084:8084"


  # ==========================================
  # AUTH SERVICE
  # ==========================================

  auth-service:
    build:
      context: ./auth-service

    container_name: ecommerce-auth-service

    depends_on:
      postgres:
        condition: service_healthy

    environment:

      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/auth_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres

      JWT_SECRET: ${JWT_SECRET}

    ports:
      - "8085:8085"


  # ==========================================
  # NOTIFICATION SERVICE
  # ==========================================

  notification-service:
    build:
      context: ./notification-service

    container_name: ecommerce-notification-service

    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

    environment:

      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/notification_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres

      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092

    ports:
      - "8086:8086"


  # ==========================================
  # SAGA ORCHESTRATOR
  # ==========================================

  saga-orchestrator:
    build:
      context: ./saga-orchestrator

    container_name: ecommerce-saga-orchestrator

    depends_on:
      kafka:
        condition: service_healthy

    environment:

      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092

    ports:
      - "8090:8090"


  # ==========================================
  # API GATEWAY
  # ==========================================

  api-gateway:
    build:
      context: ./api-gateway

    container_name: ecommerce-api-gateway

    depends_on:

      order-service:
        condition: service_started

      inventory-service:
        condition: service_started

      payment-service:
        condition: service_started

      shipping-service:
        condition: service_started

      auth-service:
        condition: service_started

      notification-service:
        condition: service_started

    environment:

      JWT_SECRET: ${JWT_SECRET}

    ports:
      - "8080:8080"


# ==========================================
# VOLUMES
# ==========================================

volumes:

  postgres_data: